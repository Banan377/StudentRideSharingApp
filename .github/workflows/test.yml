name: Spring Boot CI Testing

on:
  push:
    branches:
      - master
      
  pull_request:
    branches:
      - master
     

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Give Maven Permission
        run: chmod +x mvnw

      - name: Run Functional and Non-Functional Tests
        run: run: ./mvnw -Dtest=SwitchRoleServiceTest,SwitchRolePerformanceTest test